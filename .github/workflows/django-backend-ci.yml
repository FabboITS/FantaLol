name: Backend Django CI

on:
  push:
    paths:
      - 'fantalol-django/**'
      - '.github/workflows/django-backend-ci.yml'
  pull_request:
    paths:
      - 'fantalol-django/**'
      - '.github/workflows/django-backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantalol-django

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fantalol-django/requirements/*.txt

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt pyflakes

      - name: Lint
        run: python -m pyflakes $(git ls-files '*.py' | grep -v migrations/ | sed 's|fantalol-django/||')

      - name: Migrazioni allineate ai modelli
        run: python manage.py makemigrations --check --dry-run

      - name: Test con coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report
