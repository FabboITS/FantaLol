  name: Update LEC CSV

  on:
    workflow_dispatch:
    schedule:
      - cron: "17 * * * *"

  jobs:
    update-csv:
      runs-on: ubuntu-latest

      steps:
        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install dependencies
          run: pip install boto3

        - name: Download, filter and upload CSV
          env:
            ORACLE_CSV_URL: ${{ secrets.ORACLE_CSV_URL }}
            R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET: ${{ secrets.R2_BUCKET }}
            R2_OBJECT_KEY: ${{ secrets.R2_OBJECT_KEY }}
          run: |
            python - <<'PY'
            import csv
            import io
            import os
            import urllib.request
            import boto3

            source_url = os.environ["ORACLE_CSV_URL"]
            response = urllib.request.urlopen(source_url, timeout=120)
            raw = response.read().decode("utf-8-sig")

            reader = csv.DictReader(io.StringIO(raw))
            rows = []

            allowed_positions = {"top", "jng", "mid", "bot", "sup"}

            for row in reader:
                if row.get("league", "").strip().upper() != "LEC":
                    continue
                if row.get("split", "").strip().lower() != "summer":
                    continue
                if row.get("year", "").strip() not in ("", "2026"):
                    continue
                if row.get("datacompleteness", "").strip().lower() != "complete":
                    continue
                if row.get("position", "").strip().lower() not in allowed_positions:
                    continue
                rows.append(row)

            if not rows:
                raise RuntimeError("Nessuna partita LEC Summer 2026 trovata")

            output = io.StringIO()
            writer = csv.DictWriter(output, fieldnames=reader.fieldnames)
            writer.writeheader()
            writer.writerows(rows)

            client = boto3.client(
                "s3",
                endpoint_url=f"https://
                {os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
                aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                region_name="auto",
            )

            client.put_object(
                Bucket=os.environ["R2_BUCKET"],
                Key=os.environ["R2_OBJECT_KEY"],
                Body=output.getvalue().encode("utf-8"),
                ContentType="text/csv",
                CacheControl="no-cache",
            )

            print(f"Caricate {len(rows)} righe nel file R2")
            PY
