[project]
name = "fantalol-backend"
version = "2.0.0"
description = "FantaLol v2 — fantasy League of Legends multi-competizione (LEC, LCK, LPL, WORLDS)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "djangorestframework-camel-case>=1.4",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "apscheduler>=3.10,<4",
    "whitenoise>=6.6",
    "gunicorn>=22",
    "pillow>=10",
    "argon2-cffi>=23",
    "bcrypt>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-cov>=5",
    "factory_boy>=3.3",
    "respx>=0.21",
    "freezegun>=1.4",
    "coverage>=7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/admin.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["DJ001", "DJ008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
files = ["apps/scoring", "apps/lineups", "apps/worlds"]
