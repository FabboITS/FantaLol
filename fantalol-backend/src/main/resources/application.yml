server:
  port: ${PORT:8080}

spring:
  application:
    name: fantalol-backend

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=15000&socketTimeout=30000
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

fantalol:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  asta:
    crediti-iniziali: 1000

  pandascore:
    base-url: ${PANDASCORE_BASE_URL:https://api.pandascore.co}
    token: ${PANDASCORE_API_TOKEN:}
    summer-tournament-ids: ${PANDASCORE_SUMMER_TOURNAMENT_IDS:21344}
    schedule-sync-cron: ${PANDASCORE_SCHEDULE_SYNC_CRON:0 45 3 * * *}

  oracle:
    csv-url: ${ORACLE_ELIXIR_CSV_URL:}
    league: ${ORACLE_ELIXIR_LEAGUE:LEC}
    split: ${ORACLE_ELIXIR_SPLIT:Summer}
    sync-cron: ${ORACLE_ELIXIR_SYNC_CRON:0 15 4 * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.fantalol: INFO
    com.zaxxer.hikari: INFO
