server:
  port: ${PORT:8080}

spring:
  application:
    name: fantalol-backend
    
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

fantalol:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  asta:
    crediti-iniziali: 1000

  pandascore:
    base-url: ${PANDASCORE_BASE_URL:https://api.pandascore.co}
    token: ${PANDASCORE_API_TOKEN:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.fantalol: INFO
