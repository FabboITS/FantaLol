services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fantalol}
      POSTGRES_USER: ${DB_USER:-fantalol}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fantalol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fantalol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file: [.env]
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    # Migrazioni + seed a ogni avvio: entrambi idempotenti.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_base_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 3 --access-logfile -"
    ports:
      - "8080:8080"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    env_file: [.env]
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker --loglevel=info
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: .
    env_file: [.env]
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel=info
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
